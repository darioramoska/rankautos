                    ))}
                  </div>
                )},
              { id:'fuel', label: fuelActive?`Fuel (${filters.fuel.length})`:'Fuel', active:fuelActive, width:240,
                content:(
                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    {['Electric','Hybrid','Petrol','Diesel'].map(f=>{const Icon=FUEL_ICONS[f];const a=filters.fuel.includes(f);
                      return <button key={f} onClick={()=>setFilters(fi=>({...fi,fuel:fi.fuel.includes(f)?fi.fuel.filter(x=>x!==f):[...fi.fuel,f]}))}
                        style={{display:'flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:12,fontWeight:600,cursor:'pointer',
                          background:a?'var(--dark)':'var(--bg)',color:a?'#fff':'var(--mid)',border:`1.5px solid ${a?'var(--dark)':'var(--border)'}`}}>
                        {Icon&&Icon(a?'#fff':'var(--mid)')}{f}</button>;
                    })}
                  </div>
                )},
              { id:'trans', label: transActive?`Gearbox: ${(filters.transmission||[]).map(t=>t==='Automatic'?'Auto':t).join('+')}`:'Gearbox', active:transActive, width:210,
                content:(
                  <div style={{display:'flex',gap:6}}>
                    {['Automatic','Manual'].map(t=>{const a=(filters.transmission||[]).includes(t);
                      return <button key={t} onClick={()=>setFilters(fi=>{const ar=fi.transmission||[];return{...fi,transmission:ar.includes(t)?ar.filter(x=>x!==t):[...ar,t]};})}
                        style={{flex:1,padding:'8px',borderRadius:7,fontSize:12,fontWeight:600,cursor:'pointer',
                          background:a?'var(--dark)':'var(--bg)',color:a?'#fff':'var(--mid)',border:`1.5px solid ${a?'var(--dark)':'var(--border)'}`}}>{t}</button>;
                    })}
                  </div>
                )},
              { id:'price', label: priceActive?`€${fmt(filters.budgetMin)}–${filters.budgetMax>=80000?'80k+':fmt(filters.budgetMax)}`:'Price', active:priceActive, width:250,
                content:(
                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:10}}>
                      <span>{filters.budgetMin===0?'Any':`€${fmt(filters.budgetMin)}`}</span>
                      <span>{filters.budgetMax>=80000?'€80k+':`€${fmt(filters.budgetMax)}`}</span>
                    </div>
                    <div className="dual-range" style={{marginBottom:10}}>
                      <div style={{position:'absolute',left:0,right:0,height:4,borderRadius:2,background:'var(--border)'}}/>
                      <div style={{position:'absolute',left:`${(filters.budgetMin/80000)*100}%`,width:`${((filters.budgetMax-filters.budgetMin)/80000)*100}%`,height:4,borderRadius:2,background:'var(--dark)'}}/>
                      <input type="range" min="0" max="80000" step="2500" value={filters.budgetMin} onChange={e=>{const v=+e.target.value;if(v<filters.budgetMax-2500)setFilters(f=>({...f,budgetMin:v}));}}/>
                      <input type="range" min="0" max="80000" step="2500" value={filters.budgetMax} onChange={e=>{const v=+e.target.value;if(v>filters.budgetMin+2500)setFilters(f=>({...f,budgetMax:v}));}}/>
                    </div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                      {[{l:'Any',mn:0,mx:80000},{l:'<€25k',mn:0,mx:25000},{l:'€25–40k',mn:25000,mx:40000},{l:'€40–60k',mn:40000,mx:60000},{l:'€60k+',mn:60000,mx:80000}].map(p=>(
                        <button key={p.l} onClick={()=>setFilters(f=>({...f,budgetMin:p.mn,budgetMax:p.mx}))}
                          style={{padding:'4px 7px',borderRadius:999,fontSize:11,fontWeight:600,cursor:'pointer',
                            background:filters.budgetMin===p.mn&&filters.budgetMax===p.mx?'var(--dark)':'var(--bg)',
                            color:filters.budgetMin===p.mn&&filters.budgetMax===p.mx?'#fff':'var(--mid)',
                            border:`1px solid ${filters.budgetMin===p.mn&&filters.budgetMax===p.mx?'var(--dark)':'var(--border)'}`}}>{p.l}</button>
                      ))}
                    </div>
                  </div>
                )},
              { id:'market', label: marketActive?`Platforms (${filters.platforms.length})`:'Platforms', active:marketActive, width:220,
                content:(
                  <div style={{display:'flex',flexDirection:'column',gap:4}}>
                    {PLATFORMS.map(p=>{const a=filters.platforms.length===0||filters.platforms.includes(p.id);
                      return <button key={p.id} onClick={()=>setFilters(f=>{const isAll=f.platforms.length===0;if(isAll)return{...f,platforms:PLATFORMS.filter(x=>x.id!==p.id).map(x=>x.id)};const next=f.platforms.includes(p.id)?f.platforms.filter(x=>x!==p.id):[...f.platforms,p.id];return{...f,platforms:next.length===PLATFORMS.length?[]:next};})}
                        style={{display:'flex',alignItems:'center',gap:7,padding:'6px 9px',borderRadius:7,cursor:'pointer',
                          background:a?'var(--dark)':'var(--bg)',border:`1px solid ${a?'var(--dark)':'var(--border)'}`}}>
                        <span style={{fontSize:13}}>{p.flag}</span>
                        <span style={{fontSize:12,fontWeight:600,color:a?'#fff':'var(--mid)'}}>{p.label}</span>
                        {!a&&<span style={{marginLeft:'auto',fontSize:10,color:'var(--mid)'}}>off</span>}
                      </button>;
                    })}
                    {filters.platforms.length>0&&<button onClick={()=>setFilters(f=>({...f,platforms:[]}))}
                      style={{fontSize:11,color:'var(--mid)',cursor:'pointer',padding:'4px',textAlign:'center',border:'1px dashed var(--border)',borderRadius:6,marginTop:2}}>All platforms</button>}
                  </div>
                )},
              { id:'colour', label:(filters.colors||[]).length>0?`Colour (${filters.colors.length})`:'Colour', active:(filters.colors||[]).length>0, width:230,
                content:(
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {[{n:'White',h:'#f0f0f0',b:'#ccc'},{n:'Black',h:'#1a1a1a',b:'#000'},{n:'Silver',h:'#c8c8c8',b:'#999'},{n:'Grey',h:'#808080',b:'#555'},{n:'Blue',h:'#2155a3',b:'#1a4080'},{n:'Red',h:'#cc2200',b:'#aa1100'},{n:'Green',h:'#2e7d32',b:'#1b5e20'},{n:'Brown',h:'#795548',b:'#5d4037'}].map(c=>{
                      const a=(filters.colors||[]).includes(c.n);
                      return <button key={c.n} title={c.n} onClick={()=>setFilters(fi=>{const ar=fi.colors||[];return{...fi,colors:ar.includes(c.n)?ar.filter(x=>x!==c.n):[...ar,c.n]};})}
                        style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'5px 6px',borderRadius:8,cursor:'pointer',
                          background:a?'var(--dark)':'var(--bg)',border:`1.5px solid ${a?'var(--dark)':'var(--border)'}`}}>
                        <div style={{width:24,height:24,borderRadius:'50%',background:c.h,border:`2px solid ${c.b}`,boxShadow:a?'0 0 0 2px var(--accent)':'none'}}/>
                        <span style={{fontSize:9,fontWeight:600,color:a?'#fff':'var(--mid)'}}>{c.n}</span>
                      </button>;
                    })}
                  </div>
                )},
            ].map(({id,label,active,width,content}) => (
              <div key={id} style={{position:'relative'}}>
                <button onClick={()=>setOpenDrop(o=>o===id?null:id)} style={{
                  display:'flex', alignItems:'center', gap:5, padding:'6px 11px', borderRadius:7, cursor:'pointer',
                  background: openDrop===id?'var(--dark)':active?'oklch(0.93 0.03 260)':'var(--bg)',
                  border:`1.5px solid ${openDrop===id?'var(--dark)':active?'var(--dark)':'var(--border)'}`,
                  fontSize:12, fontWeight:600, color:openDrop===id?'#fff':active?'var(--dark)':'var(--mid)',
                  transition:'all .15s', whiteSpace:'nowrap' }}>
                  {label}
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="none" style={{transform:openDrop===id?'rotate(180deg)':'none',transition:'transform .15s',flexShrink:0}}>
                    <path d="M1.5 3l3 3 3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>
                {openDrop===id && (
                  <div style={{position:'absolute',top:'calc(100% + 5px)',left:0,zIndex:100,
                    background:'var(--surface)',borderRadius:10,padding:13,
                    border:'1px solid var(--border)',boxShadow:'0 8px 32px rgba(0,0,0,0.13)',minWidth:width}}>
                    {content}
                  </div>
                )}
              </div>
            ))}
            {(filters.fuel.length+(filters.transmission||[]).length+(filters.colors||[]).length+(filters.platforms||[]).length+(priceActive?1:0))>0&&(
              <button onClick={()=>setFilters(f=>({...f,fuel:[],transmission:[],colors:[],platforms:[],budgetMin:0,budgetMax:80000}))}
                style={{fontSize:11,color:'var(--mid)',cursor:'pointer',padding:'5px 9px',border:'1px dashed var(--border)',borderRadius:7}}>
                Clear
              </button>
            )}
          </div>
        </div>

                {ranked.length === 0 ? (
          <div style={{ textAlign:'center', padding:60, color:'var(--mid)' }}>
            <div style={{ fontSize:32, marginBottom:12 }}>○</div>
            <div style={{ fontSize:16 }}>No cars match your filters</div>
            <button onClick={() => setFilters({ fuel:[],type:[],budgetMin:0,budgetMax:80000,seats:0,platforms:[],countries:[],minRange:0,transmission:[],colors:[],minBoot:0 })}
              style={{ marginTop:16, fontSize:13, color:'var(--accent)', cursor:'pointer', textDecoration:'underline' }}>Clear all filters</button>
          </div>
        ) : (
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {ranked.map(({ car, score }, i) => (
              <ResultCard key={car.id} car={car} rank={i+1} score={score} showBadges={showBadges} onClick={() => setSelectedCar(car)}/>
            ))}
          </div>
        )}
      </div>

      {selectedCar && selEntry && (
        <CarDetail car={selectedCar} score={selEntry.score} weights={weights} platformFilter={platformFilter} onClose={() => setSelectedCar(null)}/>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#c57cb3",
  "darkBg": "#092477",
  "cardRadius": 16,
  "showBadges": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('home');
  const [filters, setFilters] = useState({ fuel:[], type:[], budgetMin:0, budgetMax:80000, seats:0, platforms:[], countries:[], minRange:0, transmission:[], colors:[], minBoot:0, maxBoot:1200 });
  const [weights, setWeights] = useState({ range:5, safety:5, practicality:5, tech:5, reliability:5, value:5, charging:3 });

  useEffect(() => {
    if (!tweaks) return;
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
    document.documentElement.style.setProperty('--dark', tweaks.darkBg);
    document.documentElement.style.setProperty('--radius', tweaks.cardRadius + 'px');
  }, [tweaks]);

  return (
    <>
      {screen==='home' && <HomeScreen filters={filters} setFilters={setFilters} onStart={() => setScreen('results')}/>}
      {screen==='results' && <ResultsScreen filters={filters} setFilters={setFilters} weights={weights} setWeights={setWeights} onBack={() => setScreen('home')} showBadges={tweaks?.showBadges ?? true}/>}
      <TweaksPanel>
        <TweakSection title="Brand">
          <TweakColor label="Accent colour" value={tweaks?.accentColor} onChange={v => setTweak('accentColor', v)}/>
          <TweakColor label="Dark background" value={tweaks?.darkBg} onChange={v => setTweak('darkBg', v)}/>
        </TweakSection>
        <TweakSection title="Cards">
          <TweakSlider label="Card radius" min={0} max={24} step={2} value={tweaks?.cardRadius} onChange={v => setTweak('cardRadius', v)}/>
          <TweakToggle label="Show badges" value={tweaks?.showBadges} onChange={v => setTweak('showBadges', v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
